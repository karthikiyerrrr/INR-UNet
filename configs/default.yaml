# Example experiment configuration. Mirrors inr_unet.config.ExperimentConfig.
model:
  name: inr_unet
  encoder:
    name: unet
    in_channels: 1
    base_channels: 64
    depth: 4
    feature_dim: 64
  decoder:
    name: liif
    hidden_dim: 256
    num_layers: 5
    n_classes: 1
    local_ensemble: true
    feature_unfold: true
    cell_decode: true
data:
  root: data
  image_size: 256
  batch_size: 8
  num_workers: 4
  synthetic:
    n_scenes: 64
    draws_per_scene: 16
    crop_size: 48
    sample_q: 2304
    label_kind: gaussian
    target_pixel_size_A_min: 0.05
    target_pixel_size_A_max: 0.30
    master_seed: 0
train:
  epochs: 100
  lr: 1.0e-4
  seed: 0
generation:
  potential_backend: z_power
  sigma_potential_A: 0.4
  aperture_soft: true
  sampler:
    fov_set_A: [8.0, 10.0, 20.0, 30.0, 40.0]
    pixel_size_A_min: 0.05
    pixel_size_A_max: 0.30
    rotation_step_deg: 15.0
    rotation_max_deg: 90.0
    offset_jitter_frac: 0.5
    conditions: [cond1, cond2, cond3, cond4, cond5]
    bg_weights:
      constant: 1.0
      linear_ramp: 1.0
      nonlinear: 1.0
    bg_constant_c_min: 0.05
    bg_constant_c_max: 0.40
    bg_ramp_c0_min: 0.05
    bg_ramp_c0_max: 0.30
    bg_ramp_g_min: 0.10
    bg_ramp_g_max: 0.60
    bg_nonlinear_blobs_min: 2
    bg_nonlinear_blobs_max: 5
    n_peak_min: 30.0
    n_peak_max: 3000.0
    n_bg_frac_max: 0.05
    scan_freq_min: 0.02
    scan_freq_max: 0.5
    scan_beta_min: 0.3
    scan_beta_max: 0.5
    z_exponent: 1.7
    device: cpu
