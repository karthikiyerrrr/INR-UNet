[project]
name = "inr-unet"
version = "0.0.1"
description = "Resolution-agnostic UNet for S/TEM image segmentation, combining AtomSegNet and LIIF."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Karthik Iyer" }]
dependencies = [
    "torch",
    "numpy",
    "omegaconf",
    "tifffile",
    "pillow",
    "pymatgen",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "marimo",
    "plotly",
    "polars",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inr_unet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# marimo notebooks are a reactive cell graph, not modules: the trailing bare
# expression in a cell is its rendered output (B018), plot/markdown builders run
# long (E501), and the import cell keeps exploratory imports the linter cannot see
# used across cells (F401/I001). These are notebook idioms, not defects.
[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "B007", "B018", "B905", "F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
