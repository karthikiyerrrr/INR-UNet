[project]
name = "inr-unet"
version = "0.0.1"
description = "Resolution-agnostic UNet for S/TEM image segmentation, combining AtomSegNet and LIIF."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Karthik Iyer" }]
dependencies = [
    "torch",
    "numpy",
    "omegaconf",
    "tifffile",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "marimo",
    "plotly",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inr_unet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
